services:
  postgres:
    image: postgres:17-alpine
    container_name: idarms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: idarms
      POSTGRES_PASSWORD: idarms
      POSTGRES_DB: idarms
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - idarms_postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idarms -d idarms"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: idarms-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: idarms
      RABBITMQ_DEFAULT_PASS: idarms
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - idarms_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  idarms_postgres_data:
  idarms_rabbitmq_data:
